name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A branch can run the suite on Linux, as a non-root user, before it merges.
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:package
      - run: npm pack --dry-run

name: Host e2e

# The Linux-gated host tests need a real systemd (PID 1), cgroup v2, nginx and
# root. ubuntu-24.04 is a KVM VM with systemd and passwordless sudo, so they
# run here with INCIBASE_TEST_REQUIRE_SANDBOX=1 (every sandbox directive must
# take effect, except SocketBindDeny, which Ubuntu 24.04's systemd is built
# without the BPF framework for; host doctor reports that). This never
# publishes anything.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - ".github/workflows/host-e2e.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  host-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          # The tests render and test nginx themselves; it must not be serving its default site meanwhile.
          sudo systemctl stop nginx
          sudo systemctl disable nginx

      - run: bun install --frozen-lockfile

      - name: Build the standalone binary
        run: |
          bun scripts/build-binary.ts
          ls -l dist/incibase
          dist/incibase --version

      - name: Run the Linux-gated host tests
        env:
          # sudo resets PATH, so the Bun that runs the tests and the tools the tests spawn are named explicitly.
          TEST_PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          mkdir -p artifacts
          BUN="$(command -v bun)"
          BIN="$GITHUB_WORKSPACE/dist/incibase"
          echo "bun: $BUN"
          echo "binary: $BIN"
          # -E keeps the INCIBASE_TEST_* vars; PATH is set explicitly because sudo would otherwise reset it.
          sudo -E env \
            "PATH=$TEST_PATH" \
            INCIBASE_TEST_HOST=1 \
            INCIBASE_TEST_BINARY="$BIN" \
            INCIBASE_TEST_REQUIRE_SANDBOX=1 \
            "$BUN" test \
              test/host-linux.test.ts \
              test/host-snapshot-linux.test.ts \
              test/host-systemd.test.ts \
              test/host-check-linux.test.ts \
              test/host-nginx-linux.test.ts \
              test/host-runtime-linux.test.ts \
              test/host-isolation.test.ts \
            2>&1 | tee artifacts/host-e2e.log

      - name: host doctor on this machine
        if: always()
        env:
          TEST_PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        # A throwaway host with the built runtime installed and its own CLI link (what its check service runs)
        # pointing there, so doctor's sandbox probe runs on the real VM.
        # Never fails the job: doctor exits 1 on any FAIL (a bare host has no TLS or alert webhook).
        run: |
          mkdir -p artifacts
          BIN="$GITHUB_WORKSPACE/dist/incibase"
          ROOT=/var/lib/incibase-doctor
          LAYOUT='{"unitPrefix":"ibdoc","groups":{"proxy":"ibdoc-proxy","admin":"ibdoc-admin"},"runtimeRoot":"/usr/local/lib/ibdoc","cliLink":"/usr/local/lib/ibdoc-bin/incibase"}'
          VER="$("$BIN" --version | tr -d '[:space:]')"
          SHA="$(sha256sum "$BIN" | cut -d' ' -f1)"
          sudo install -d -m 0755 /usr/local/lib/ibdoc-bin
          sudo env "PATH=$TEST_PATH" "$BIN" host op initHost "{\"domain\":\"incibase.example.net\",\"timezone\":\"UTC\",\"uidBase\":90000}" --root "$ROOT" --layout "$LAYOUT" || true
          sudo env "PATH=$TEST_PATH" "$BIN" host op installRuntime "{\"binary\":\"$BIN\",\"version\":\"$VER\",\"sha256\":\"$SHA\"}" --root "$ROOT" || true
          sudo env "PATH=$TEST_PATH" "$BIN" host op useCli "{\"version\":\"$VER\"}" --root "$ROOT" || true
          sudo env "PATH=$TEST_PATH" "$BIN" host doctor --root "$ROOT" 2>&1 | tee artifacts/doctor.log || true

      - name: Network diagnostics
        if: always()
        # What explains a network verdict in the test log: this runner's IPv6 addresses and routes, whether a ULA
        # has a route at all, any ip6tables rule that could answer for one, and the branch filter as systemd parses
        # it (from the doctor host's template, which the step above installed). Never fails the job.
        run: |
          mkdir -p artifacts
          {
            for cmd in "ip -6 addr" "ip -6 route" "ip -6 route get fd00::1" "sudo ip6tables -S" \
              "systemctl show -p IPAddressDeny -p IPAddressAllow ibdoc-branch@diag.service"; do
              echo "\$ $cmd"
              $cmd 2>&1 || echo "(exit $?)"
            done
          } | tee artifacts/network.log

      - name: Upload the test and doctor output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-e2e-output
          path: artifacts/
          if-no-files-found: warn
